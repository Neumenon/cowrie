[workspace]
members = ["."]

[package]
name = "cowrie-rs"
version = "2.1.2"
edition = "2021"
description = "Cowrie v1 — deterministic, content-addressable, AI-native binary codec (zero-copy tensors, multihash content addresses, Merkle file identity)"
license = "MIT"
repository = "https://github.com/Neumenon/cowrie"
homepage = "https://github.com/Neumenon/cowrie"
documentation = "https://docs.rs/cowrie-rs"
readme = "README.md"
keywords = ["json", "binary", "serialization", "codec", "tensor"]
categories = ["encoding", "data-structures"]

[dependencies]
# Compression
flate2 = "1.0"
zstd = { version = "0.13", optional = true }

# JSON bridge
serde_json = "1.0"
base64 = "0.22"

# Content addressing (SPEC-v1 §3): multihash SHA-256 of canonical wire bytes
sha2 = "0.10"

[dev-dependencies]

[features]
default = []
zstd = ["dep:zstd"]  # Optional zstd compression

[[bench]]
name = "decode_bench"
harness = false
