[build-system]
requires = ["setuptools>=61.0", "numpy>=1.21"]
build-backend = "setuptools.build_meta"

[project]
name = "cowrie-py"
version = "2.1.1"
description = "Cowrie - Structured JSON binary codec with optional C extension (10x faster)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["json", "binary", "serialization", "codec", "tensor", "ml", "vllm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "cython>=3.0",
    "numpy>=1.21",
]

[project.urls]
Homepage = "https://github.com/Neumenon/cowrie"
Repository = "https://github.com/Neumenon/cowrie"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
# Only build CPython (C extension uses CPython API)
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_i686"
test-command = "python -c \"from cowrie.gen2 import _HAS_NATIVE; assert _HAS_NATIVE\""

[tool.cibuildwheel.linux]
before-build = "yum install -y zlib-devel 2>/dev/null || apk add zlib-dev 2>/dev/null || true"
archs = "x86_64 aarch64"

[tool.cibuildwheel.macos]
archs = "x86_64 arm64"
