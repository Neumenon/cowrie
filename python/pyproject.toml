[build-system]
requires = ["setuptools>=61.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cowrie-py"
version = "2.1.2"
description = "Cowrie - Structured JSON binary codec with an optional Cython accelerator (~10x faster encode/decode)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["json", "binary", "serialization", "codec", "tensor", "ml", "vllm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# NumPy is a runtime dependency: the native Cython accelerator (cowrie._cext)
# imports NumPy at module-import time. Without it installed, `from ._cext import …`
# raises and gen2 silently falls back to pure Python — so wheels ship native but
# would not run native. Pinning it here makes native the default on a normal install.
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "cython>=3.0",
    "numpy>=2.0",
]

[project.urls]
Homepage = "https://github.com/Neumenon/cowrie"
Repository = "https://github.com/Neumenon/cowrie"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
# Only build CPython (C extension uses CPython API)
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_i686"
# The native extension imports NumPy, so the smoke test's isolated venv needs it
# too — otherwise COWRIE_REQUIRE_NATIVE=1 fails because _cext can't import.
test-requires = "numpy>=2.0"
test-command = "COWRIE_REQUIRE_NATIVE=1 python {project}/scripts/wheel_smoke.py"

[tool.cibuildwheel.linux]
before-build = "yum install -y zlib-devel 2>/dev/null || apk add zlib-dev 2>/dev/null || true"
archs = "x86_64 aarch64"

[tool.cibuildwheel.macos]
archs = "x86_64 arm64"
