# Publish cowrie-py to PyPI with pre-built binary wheels
#
# Security hardening:
#   - All actions pinned by SHA (tags can be moved in supply-chain attacks)
#   - Minimal permissions per job (no global write access)
#   - Separate build and publish jobs (build can't exfiltrate publish creds)
#   - PyPI trusted publishing via OIDC (no API tokens stored as secrets)
#   - GitHub environment protection on publish job (requires approval)
#   - No third-party actions beyond official GitHub + PyPA
#   - cibuildwheel pinned to exact version (not @latest)
#
# Trigger: push a tag matching v* (e.g. v2.1.1)
# Setup: configure PyPI trusted publisher at https://pypi.org/manage/project/cowrie-py/settings/publishing/
#   Owner: Neumenon, Repo: cowrie, Workflow: publish-pypi.yml, Environment: pypi

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

# Top-level: no permissions. Each job declares only what it needs.
permissions: {}

jobs:
  # ─── Cross-language test gate ─────────────────────────────────
  # Mirrors the language + fixture jobs from ci.yml so a tag cannot
  # publish to PyPI when Go/Rust/TS/Python or the fixture harness is red.
  test:
    name: Test gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - name: Go build + test
        run: cd go && go build ./... && go test -race ./...

      - name: Python install + test
        run: |
          cd python && pip install -e ".[dev]"
          pytest tests/ -v --tb=short --cov=cowrie --cov-fail-under=80

      - name: TypeScript install + test
        run: |
          cd typescript && npm ci
          npm test

      - name: Rust build + test
        run: cd rust && cargo build && cargo test

      - name: Cross-language fixture validation
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd go && go build -o "$RUNNER_TEMP/cowrie-cli" ./cmd/cowrie
          GO_CLI="$RUNNER_TEMP/cowrie-cli" python3 testdata/fixtures/validate_fixtures.py

  # ─── Build sdist ──────────────────────────────────────────────
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Build sdist
        working-directory: python
        run: |
          pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error

  # ─── Build wheels (Linux, macOS, Windows) ─────────────────────
  build-wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: pip install cibuildwheel==3.4.1

      - name: Build wheels
        working-directory: python
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # Build for CPython only (no PyPy — C extension uses CPython API)
          CIBW_BUILD: 'cp39-* cp310-* cp311-* cp312-* cp313-*'
          CIBW_SKIP: '*-musllinux_i686'
          # Install zlib (needed by gen2.c)
          CIBW_BEFORE_BUILD_LINUX: 'yum install -y zlib-devel || apk add zlib-dev'
          CIBW_BEFORE_BUILD_MACOS: 'brew install zlib || true'
          # Windows: zlib bundled with Python, should work
          # Test the wheel — conformance smoke (round-trips + golden bytes + malformed input).
          # Pure-Python for 2.1.2: native is NOT required (the Cython accelerator is
          # best-effort and falls back to pure Python). {project} is the python/ dir
          # because cibuildwheel runs with working-directory: python.
          CIBW_TEST_COMMAND: >
            python {project}/scripts/wheel_smoke.py
          # Build numpy for build-time headers
          CIBW_BUILD_FRONTEND: 'pip'
          # macOS: build universal2 (x86_64 + arm64)
          CIBW_ARCHS_MACOS: 'x86_64 arm64'
          CIBW_ARCHS_LINUX: 'x86_64 aarch64'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: wheels-${{ matrix.os }}
          path: python/wheelhouse/*.whl
          if-no-files-found: error

  # ─── Publish to PyPI (OIDC trusted publisher, no tokens) ──────
  publish:
    name: Publish to PyPI
    needs: [test, build-sdist, build-wheels]
    runs-on: ubuntu-latest
    # GitHub environment with protection rules (optional: require manual approval)
    environment:
      name: pypi
      url: https://pypi.org/project/cowrie-py/
    permissions:
      id-token: write  # Required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        run: |
          echo "=== Artifacts to publish ==="
          ls -la dist/
          echo "=== Wheel count ==="
          ls dist/*.whl 2>/dev/null | wc -l
          echo "=== Sdist ==="
          ls dist/*.tar.gz

      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc  # v1.12.4
        with:
          packages-dir: dist/
          # Attestations: sign packages with Sigstore (free, verifiable)
          attestations: true
