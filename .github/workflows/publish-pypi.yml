# Publish cowrie-py to PyPI with pre-built binary wheels
#
# Security hardening:
#   - All actions pinned by SHA (tags can be moved in supply-chain attacks)
#   - Minimal permissions per job (no global write access)
#   - Separate build and publish jobs (build can't exfiltrate publish creds)
#   - PyPI trusted publishing via OIDC (no API tokens stored as secrets)
#   - GitHub environment protection on publish job (requires approval)
#   - No third-party actions beyond official GitHub + PyPA
#   - cibuildwheel pinned to exact version (not @latest)
#
# Trigger: push a tag matching v* (e.g. v2.1.1)
# Setup: configure PyPI trusted publisher at https://pypi.org/manage/project/cowrie-py/settings/publishing/
#   Owner: Neumenon, Repo: cowrie, Workflow: publish-pypi.yml, Environment: pypi

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

# Top-level: no permissions. Each job declares only what it needs.
permissions: {}

jobs:
  # ─── Cross-language test gate ─────────────────────────────────
  # Mirrors the language + fixture jobs from ci.yml so a tag cannot
  # publish to PyPI when Go/Rust/TS/Python or the fixture harness is red.
  test:
    name: Test gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.21'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Go build + test
        run: cd go && go build ./... && go test -race ./...

      - name: Python install + test
        run: |
          cd python && pip install -e ".[dev]"
          pytest tests/ -v --tb=short --cov=cowrie --cov-fail-under=80

      - name: TypeScript install + test
        run: |
          cd typescript && npm ci
          npm test

      - name: Rust build + test
        run: cd rust && cargo build && cargo test

      - name: Cross-language fixture validation
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd go && go build -o "$RUNNER_TEMP/cowrie-cli" ./cmd/cowrie
          GO_CLI="$RUNNER_TEMP/cowrie-cli" python3 testdata/fixtures/validate_fixtures.py

  # ─── Build sdist ──────────────────────────────────────────────
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Check PyPI version matches tag
        working-directory: python
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="$VERSION" python - <<'PY'
          import os, pathlib, sys, tomllib
          version = os.environ["VERSION"]
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          if project["version"] != version:
              print(f"Tag v{version} does not match python/pyproject.toml={project['version']}", file=sys.stderr)
              sys.exit(1)
          print(f"PyPI manifest matches v{version}")
          PY

      - name: Build sdist
        working-directory: python
        run: |
          pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error

  # ─── Build wheels (Linux, macOS) ─────────────────────────────
  build-wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Native wheels are currently validated for Linux/macOS. Windows installs
        # use the sdist pure-Python fallback until MSVC/zlib wheel support is proven.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: pip install cibuildwheel==3.4.1

      - name: Build wheels
        working-directory: python
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # Build for CPython only (no PyPy — C extension uses CPython API)
          CIBW_BUILD: 'cp39-* cp310-* cp311-* cp312-* cp313-*'
          CIBW_SKIP: '*-win32 *-win_amd64 *-win_arm64 *-musllinux_i686'
          # Install zlib (needed by gen2.c)
          CIBW_BEFORE_BUILD_LINUX: 'yum install -y zlib-devel || apk add zlib-dev'
          CIBW_BEFORE_BUILD_MACOS: 'brew install zlib || true'
          # Test the wheel — conformance smoke (round-trips + golden bytes + malformed
          # input) with the native Cython extension REQUIRED: it must build, load, and
          # produce conformant bytes (built against NumPy 2.x for a portable ABI).
          # {project} is the python/ dir because cibuildwheel runs working-directory: python.
          # The native extension imports NumPy, so the isolated test venv needs it or
          # _cext fails to load and COWRIE_REQUIRE_NATIVE=1 (correctly) fails the smoke.
          CIBW_TEST_REQUIRES: 'numpy>=2.0'
          CIBW_TEST_ENVIRONMENT: 'COWRIE_REQUIRE_NATIVE=1'
          CIBW_TEST_COMMAND: 'python {project}/scripts/wheel_smoke.py'
          # Build numpy for build-time headers
          CIBW_BUILD_FRONTEND: 'pip'
          # macOS: build universal2 (x86_64 + arm64)
          CIBW_ARCHS_MACOS: 'x86_64 arm64'
          # Keep Linux to native x86_64 for v2.1.2; aarch64 needs an explicit QEMU/binfmt setup.
          CIBW_ARCHS_LINUX: 'x86_64'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: wheels-${{ matrix.os }}
          path: python/wheelhouse/*.whl
          if-no-files-found: error

  # ─── Publish to PyPI (OIDC trusted publisher, no tokens) ──────
  publish:
    name: Publish to PyPI
    needs: [test, build-sdist, build-wheels]
    runs-on: ubuntu-latest
    # GitHub environment with protection rules (optional: require manual approval)
    environment:
      name: pypi
      url: https://pypi.org/project/cowrie-py/
    permissions:
      id-token: write  # Required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        run: |
          echo "=== Artifacts to publish ==="
          ls -la dist/
          echo "=== Wheel count ==="
          wheel_count="$(ls dist/*.whl 2>/dev/null | wc -l)"
          echo "$wheel_count"
          if [ "$wheel_count" -lt 1 ]; then
            echo "::error::No wheels were built"
            exit 1
          fi
          echo "=== Sdist ==="
          ls dist/*.tar.gz

      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc  # v1.12.4
        with:
          packages-dir: dist/
          # Attestations: sign packages with Sigstore (free, verifiable)
          attestations: true
