name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'  # Weekly: Sunday 4am UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Go Fuzz ──────────────────────────────────────────────────────
  go-fuzz:
    name: Go Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.21'

      - name: Fuzz MasterStreamReader
        run: cd go && go test -fuzz=FuzzMasterStreamReader_Next -fuzztime=5m ./codec/
      - name: Fuzz DecodeBytes
        run: cd go && go test -fuzz=FuzzDecodeBytes -fuzztime=5m ./codec/
      - name: Fuzz FastEncode
        run: cd go && go test -fuzz=FuzzFastEncode -fuzztime=5m ./codec/
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-fuzz-crashes
          path: |
            go/codec/testdata/fuzz/

  # ─── Rust Fuzz ────────────────────────────────────────────────────
  rust-fuzz:
    name: Rust Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz decode
        run: cd rust && cargo fuzz run fuzz_decode -- -max_total_time=300
      - name: Fuzz roundtrip
        run: cd rust && cargo fuzz run fuzz_roundtrip -- -max_total_time=300
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-fuzz-crashes
          path: |
            rust/fuzz/artifacts/

  # ─── Python Hypothesis ───────────────────────────────────────────
  python-hypothesis:
    name: Python Hypothesis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install
        run: |
          cd python && pip install -e ".[dev]"
          pip install hypothesis

      - name: Run hypothesis tests
        run: cd python && pytest tests/test_hypothesis.py -v --tb=short -x
