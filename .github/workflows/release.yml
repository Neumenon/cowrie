name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            plat_tag: manylinux_2_28_x86_64
            lib_name: libcowrie_core.so
            bin_name: cowrie
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            plat_tag: manylinux_2_28_aarch64
            lib_name: libcowrie_core.so
            bin_name: cowrie
          - os: macos-14
            target: aarch64-apple-darwin
            plat_tag: macosx_11_0_arm64
            lib_name: libcowrie_core.dylib
            bin_name: cowrie
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            plat_tag: win_amd64
            lib_name: cowrie_core.dll
            bin_name: cowrie.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build native Rust core & CLI
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p /tmp/cowrie-stage
          cp target/${{ matrix.target }}/release/${{ matrix.lib_name }} /tmp/cowrie-stage/
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} /tmp/cowrie-stage/
      - name: Build self-contained py3-none wheel
        shell: bash
        run: |
          python -m pip install --upgrade setuptools wheel
          COWRIE_PREBUILT_DIR=/tmp/cowrie-stage python setup.py bdist_wheel --plat-name ${{ matrix.plat_tag }} --dist-dir dist-wheels
      - name: Package standalone CLI archive
        shell: bash
        run: |
          mkdir -p dist-bins
          tar -czf dist-bins/cowrie-${{ matrix.target }}.tar.gz -C /tmp/cowrie-stage ${{ matrix.bin_name }} ${{ matrix.lib_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist-wheels/*.whl
            dist-bins/*.tar.gz

  build-wasm-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build stripped cowrie_core.wasm & pack npm tarball
        run: |
          RUSTFLAGS="-C strip=symbols" CARGO_TARGET_DIR=/tmp/cowrie-cargo-target cargo build -p cowrie-core --target wasm32-unknown-unknown --release
          cp /tmp/cowrie-cargo-target/wasm32-unknown-unknown/release/cowrie_core.wasm wasm/cowrie_core.wasm
          node wasm/test_wasm.mjs
          node adapters/cloudflare-workers/test_worker.mjs
          cd wasm && npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: dist-npm
          path: wasm/*.tgz

  github-release:
    needs: [build-native, build-wasm-npm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*.whl
            release-artifacts/*.tar.gz
            release-artifacts/*.tgz
