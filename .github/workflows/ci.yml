name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.21'
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ─── Go ────────────────────────────────────────────────────────────
  go:
    name: Go
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vet
        run: cd go && go vet ./...

      - name: Build
        run: cd go && go build ./...

      - name: Test with coverage
        run: cd go && go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage threshold
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd go
          # Exclude cmd/ packages (CLI entry points, not core codec).
          # Path is /go/v2/cmd/ since the module is github.com/Neumenon/cowrie/go/v2;
          # the old /go/cmd/ pattern matched nothing, wrongly counting 0%-covered
          # cmd/ packages and dragging the gate to ~76.6% (a false CI failure).
          grep -v "^github.com/Neumenon/cowrie/go/v2/cmd/" coverage.out > coverage-core.out || cp coverage.out coverage-core.out
          COVERAGE=$(go tool cover -func=coverage-core.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage (excluding cmd/): ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi

      - name: Benchmark (baseline)
        if: matrix.os == 'ubuntu-latest'
        run: cd go && go test -bench=. -benchmem -count=1 -run='^$' ./... | tee bench.txt

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: go/coverage.out

      - name: Upload benchmark
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: go-bench
          path: go/bench.txt

  # ─── Python ────────────────────────────────────────────────────────
  python:
    name: Python
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: cd python && pip install -e ".[dev]"

      - name: Typecheck
        run: |
          pip install mypy
          cd python && mypy cowrie/ --ignore-missing-imports

      - name: Test with coverage
        run: cd python && pytest tests/ -v --tb=short --cov=cowrie --cov-report=term-missing --cov-fail-under=80

  # ─── TypeScript ────────────────────────────────────────────────────
  typescript:
    name: TypeScript
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: cd typescript && npm ci

      - name: Typecheck
        run: cd typescript && npx tsc --noEmit

      - name: Test
        run: cd typescript && npm test

      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: cd typescript && npx c8 --check-coverage --lines 80 --reporter text-summary node --import tsx --test src/**/*.test.ts

  # ─── Rust ──────────────────────────────────────────────────────────
  rust:
    name: Rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cd rust && cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cd rust && cargo build

      - name: Test
        run: cd rust && cargo test

      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-tarpaulin || true
          cd rust && cargo tarpaulin --out Stdout --timeout 300 --fail-under 80

      - name: Benchmark (baseline)
        if: matrix.os == 'ubuntu-latest'
        run: cd rust && cargo bench 2>/dev/null || echo "No benchmarks configured"

  # ─── Cross-Language Fixture Validation ─────────────────────────────
  fixtures:
    name: Cross-Language Fixtures
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python package
        run: cd python && pip install -e ".[dev]"

      - name: Install TS package
        run: cd typescript && npm ci

      - name: Build Go reference decoder
        run: cd go && go build -o "$RUNNER_TEMP/cowrie-cli" ./cmd/cowrie

      - name: Validate fixtures by decoding with the Go reference decoder
        env:
          GO_CLI: ${{ runner.temp }}/cowrie-cli
        run: python3 testdata/fixtures/validate_fixtures.py

  # ─── Robustness Tests ─────────────────────────────────────────────
  robustness:
    name: Robustness
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python deps
        run: cd python && pip install -e ".[dev]"

      - name: Install TS deps
        run: cd typescript && npm ci

      - name: Go robustness tests
        run: cd go && go test -run "TruthTable|PerfCliff|Mutation" -v -timeout 10m ./...

      - name: Python robustness tests
        run: cd python && pytest tests/test_truth_table.py tests/test_mutation.py -v --tb=short

      - name: TypeScript robustness tests
        run: cd typescript && node --import tsx --test src/gen2/truth_table.test.ts src/gen2/mutation.test.ts

      - name: Rust robustness tests
        run: cd rust && cargo test --test truth_table --test mutation --test perf_cliff -- --nocapture

  # ─── Publish Gate v2 ───────────────────────────────────────────────
  publish-gate:
    name: Publish Gate
    needs: [go, python, typescript, rust, fixtures]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "=== Publish Gate v2 ==="
          echo ""

          ALL_PASS=true

          check_job() {
            local name=$1 result=$2
            if [[ "$result" == "success" ]]; then
              echo "  ✅ $name"
            elif [[ "$result" == "skipped" ]]; then
              echo "  ⏭️  $name (skipped)"
            else
              echo "  ❌ $name ($result)"
              ALL_PASS=false
            fi
          }

          echo "Language suites:"
          check_job "Go"         "${{ needs.go.result }}"
          check_job "Python"     "${{ needs.python.result }}"
          check_job "TypeScript" "${{ needs.typescript.result }}"
          check_job "Rust"       "${{ needs.rust.result }}"
          echo ""
          echo "Integration:"
          check_job "Fixtures"   "${{ needs.fixtures.result }}"
          echo ""

          if [[ "$ALL_PASS" != "true" ]]; then
            echo "::error::Publish gate FAILED — one or more jobs did not pass"
            exit 1
          fi
          echo "All checks passed. Safe to publish."

  # ─── Publish: PyPI ─────────────────────────────────────────────────
  # PyPI publishing is owned exclusively by .github/workflows/publish-pypi.yml
  # (cibuildwheel binary wheels, OIDC trusted publishing, SHA-pinned actions).
  # A second publish job here also triggered on v* tags and raced it, causing an
  # HTTP 400 duplicate-upload on the first release tag. Removed deliberately.

  # ─── Publish: npm ──────────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    needs: [publish-gate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
      - name: Build and publish
        run: |
          cd typescript && npm ci && npm run build 2>/dev/null || true
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── Publish: crates.io ────────────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: [publish-gate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cd rust && cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
