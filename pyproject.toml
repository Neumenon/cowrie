[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cowrie-ai"
version = "1.2.0"
description = "Drop-in MCP virtualization & taint firewall (`cowrie mcp-proxy`), vLLM cross-restart KV offloader (`CowrieKVConnectorV1`), and 16 KB AI binary container."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["ai", "mcp", "vllm", "kv-cache", "llm", "agents", "langgraph", "pydantic-ai", "security", "merkle", "ed25519"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Neumenon/cowrie"
Repository = "https://github.com/Neumenon/cowrie"
Documentation = "https://github.com/Neumenon/cowrie/blob/main/docs/GAINS-AND-USES.md"

[project.optional-dependencies]
vllm = ["torch>=2.2", "vllm>=0.15.0"]
langgraph = ["langgraph>=0.2"]
pydantic-ai = ["pydantic-ai>=0.1"]
openai-agents = ["openai-agents>=0.0.10"]
diffusers = ["torch>=2.2", "diffusers>=0.30"]
lancedb = ["lancedb>=0.15"]

[project.scripts]
cowrie = "cowrie._cli:main"

[project.entry-points."vllm.general_plugins"]
cowrie_kv_connector = "cowrie_vllm_adapters._plugin:register_vllm_plugin"

[tool.setuptools]
package-dir = { "cowrie" = "python/cowrie", "cowrie.integrations" = "python/cowrie/integrations", "cowrie_vllm_adapters" = "adapters/vllm" }
packages = ["cowrie", "cowrie.integrations", "cowrie_vllm_adapters"]
include-package-data = true
